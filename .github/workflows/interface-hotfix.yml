name: إصلاح واجهة التاسعة نيوز
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/interface_hotfix.py
      - index.html
      - ticker.json
      - assets/app.js
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: write
concurrency:
  group: altaasah-news-interface
  cancel-in-progress: false
jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Sync main
        run: git pull --rebase origin main
      - name: Apply interface hotfix
        run: python scripts/interface_hotfix.py
      - name: Commit interface
        run: |
          git config user.name 'التاسعة نيوز'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'لا توجد تغييرات واجهة.'; exit 0; fi
          git commit -m 'إصلاح واجهة الصفحة الرئيسية وإظهار التنقل والشريط الإخباري'
          git push origin main
