name: تحديث أخبار التاسعة نيوز

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: تحميل ملفات الموقع
        uses: actions/checkout@v4

      - name: التحقق من ملف التحديث
        run: |
          test -f scripts/update_news.py
          python -m py_compile scripts/update_news.py

      - name: تحديث الأخبار والصور
        run: python scripts/update_news.py

      - name: حفظ الأخبار والصور
        run: |
          git config user.name "Altaasah News Bot"
          git config user.email "actions@github.com"
          git add news.json assets/news/
          if git diff --cached --quiet; then
            echo "لا توجد تحديثات جديدة."
          else
            git commit -m "تحديث الأخبار والصور تلقائيا"
            git push
          fi
