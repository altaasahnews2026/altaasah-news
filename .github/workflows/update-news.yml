name: تحديث الأخبار اليومية

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/update-news.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: altaasah-news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Python packages
        run: python -m pip install --upgrade pip && pip install Pillow requests

      - name: Fetch Iraq and dedicated Kirkuk news
        run: python scripts/update_news.py

      - name: Fetch additional Iraqi news sources
        run: python scripts/augment_sources.py

      - name: Clean and deduplicate news
        run: python scripts/clean_news.py

      - name: Prioritize fresh homepage news
        run: python scripts/prioritize_kirkuk.py

      - name: Remove duplicate or broken news images
        run: python scripts/dedupe_news_images.py

      - name: Generate article pages
        run: python scripts/generate_articles.py

      - name: Build latest-news ticker data
        run: python scripts/build_ticker.py

      - name: Validate news data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('news.json').read_text(encoding='utf-8'))
          items=d.get('items',[])
          assert items, 'لا توجد أخبار بعد التحديث'
          assert all(x.get('title') and x.get('url') and x.get('image') for x in items)
          assert len({x.get('url') for x in items}) == len(items), 'روابط أخبار مكررة'
          print('NEWS OK:', len(items))
          PY

      - name: Commit and push news changes
        run: |
          git config user.name 'التاسعة نيوز'
          git config user.email 'actions@users.noreply.github.com'
          git add news.json news assets/news ticker.json
          if git diff --cached --quiet; then
            echo 'لا توجد تغييرات إخبارية.'
            exit 0
          fi
          git commit -m 'استئناف التحديث الدوري للأخبار'
          git push origin main
