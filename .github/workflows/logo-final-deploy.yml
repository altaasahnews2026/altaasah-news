name: Final logo repair
on:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  repair:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v6
      - name: Replace logo references with direct raw asset
        run: |
          python - <<'PY'
          from pathlib import Path
          old='assets/logo.jpg?v=20260916-12'
          new='https://raw.githubusercontent.com/altaasahnews2026/altaasah-news/main/assets/logo.jpg?v=20260916-16'
          for p in [Path('index.html'),Path('assets/app.js')]:
              s=p.read_text(encoding='utf-8')
              s=s.replace(old,new)
              s=s.replace("https://altaasahnews2026.github.io/altaasah-news/assets/logo.jpg?v=20260916-12",new)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit permanent fix to main
        run: |
          git config user.name 'التاسعة نيوز'
          git config user.email 'newsaltast@gmail.com'
          git add index.html assets/app.js
          git commit -m 'Fix logo with direct image URL' || true
          git push origin HEAD:main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
