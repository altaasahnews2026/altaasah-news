name: Professional Header Logo
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/header-logo-position.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-header-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Force official logo rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          logo='./assets/logo.jpg?v=20260913'
          # Replace every logo image source with the uploaded official asset.
          s=re.sub(r'(?:https://altaasahnews2026\.github\.io/altaasah-news/)?(?:\./)?assets/logo\.(?:svg|jpg)(?:\?[^\"\']*)?',logo,s,flags=re.I)
          # If the brand container has no image, insert the official logo.
          tag='<img class="official-site-logo" src="'+logo+'" alt="التاسعة نيوز" width="220" height="74">'
          m=re.search(r'(<[^>]+class=[\"\'][^\"\']*brand[^\"\']*[\"\'][^>]*>)(.*?)(</[^>]+>)',s,flags=re.I|re.S)
          if m and not re.search(r'<img\b',m.group(2),flags=re.I):
              s=s[:m.start(2)]+tag+m.group(2)+s[m.end(2):]
          css='''<style id="official-logo-fix">.brand{display:flex!important;align-items:flex-start!important;min-width:220px!important;min-height:74px!important}.brand img,.official-site-logo{display:block!important;visibility:visible!important;opacity:1!important;width:220px!important;height:74px!important;object-fit:contain!important}@media(max-width:700px){.brand{align-items:center!important;justify-self:center!important;min-width:185px!important;min-height:58px!important}.brand img,.official-site-logo{width:185px!important;height:58px!important}}</style>'''
          s=re.sub(r'<style id="official-logo-fix">.*?</style>','',s,flags=re.S)
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "التاسعة نيوز"
          git config user.email "newsalt@gmail.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Force official logo rendering"
          git push
