name: Permanent media repair and deploy
on:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  repair:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install verified logo and repair all media references
        shell: bash
        env:
          LOGO_B64: "/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQX"
        run: |
          set -e
          mkdir -p assets/news
          printf '%s' "$LOGO_B64" | base64 -d > assets/logo-guaranteed.jpg
          python - <<'PY'
          from pathlib import Path
          import json, re, subprocess, hashlib, urllib.parse
          logo = 'assets/logo-guaranteed.jpg?v=20260916-23'
          for path in [Path('index.html'), Path('assets/app.js')]:
              s = path.read_text(encoding='utf-8')
              s = re.sub(r'(?:https://raw\.githubusercontent\.com/altaasahnews2026/altaasah-news/main/)?assets/logo(?:-final\.svg|\.jpg)(?:\?v=[^"\\\']*)?', logo, s)
              s = re.sub(r"const LOGO=BASE\+'[^']+';", "const LOGO=BASE+'"+logo+"';", s)
              path.write_text(s, encoding='utf-8')
          p = Path('news.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'
          def fetch(url, out):
              try:
                  subprocess.run(['curl','-L','--fail','--silent','--show-error','--max-time','20','-A',ua,'-o',str(out),url], check=True)
                  return out.exists() and out.stat().st_size > 500
              except Exception:
                  return False
          def ext_for(url):
              path = urllib.parse.urlparse(url).path.lower()
              for ext in ('.jpg','.jpeg','.png','.webp','.gif','.jfif'):
                  if path.endswith(ext): return ext
              return '.jpg'
          for i, item in enumerate(data.get('items', [])):
              src = str(item.get('image') or item.get('original_image') or '').strip()
              chosen = src
              if not chosen:
                  article = str(item.get('url') or item.get('article_url') or '').strip()
                  if article:
                      try:
                          html = subprocess.check_output(['curl','-L','--fail','--silent','--show-error','--max-time','20','-A',ua,article], text=True, stderr=subprocess.DEVNULL)
                          m = re.search(r'<meta[^>]+property=["\\\']og:image["\\\'][^>]+content=["\\\']([^"\\\']+)', html, re.I)
                          if not m:
                              m = re.search(r'<meta[^>]+content=["\\\']([^"\\\']+)["\\\'][^>]+property=["\\\']og:image["\\\']', html, re.I)
                          if m: chosen = urllib.parse.urljoin(article, m.group(1))
                      except Exception: pass
              if chosen:
                  name = hashlib.sha1(chosen.encode()).hexdigest()[:16] + ext_for(chosen)
                  out = Path('assets/news') / name
                  if fetch(chosen, out):
                      item['image'] = 'assets/news/' + name
                      item['original_image'] = 'assets/news/' + name
                      continue
              item['image'] = 'assets/news-placeholder.svg'
              item['original_image'] = 'assets/news-placeholder.svg'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          js = Path('assets/app.js')
          s = js.read_text(encoding='utf-8')
          s = re.sub(r"const PLACEHOLDER=BASE\+'[^']+';", "const PLACEHOLDER=BASE+'assets/news-placeholder.svg?v=20260916-23';", s)
          s = re.sub(r"const LOGO=BASE\+'[^']+';", "const LOGO=BASE+'"+logo+"';", s, count=1)
          js.write_text(s, encoding='utf-8')
          PY
      - name: Validate before deployment
        run: |
          set -e
          test -s assets/logo-guaranteed.jpg
          test -s assets/news-placeholder.svg
          node --check assets/app.js
          grep -q "logo-guaranteed.jpg" index.html
          grep -q "logo-guaranteed.jpg" assets/app.js
          python - <<'PY'
          import json
          d=json.load(open('news.json',encoding='utf-8'))
          assert d.get('items')
          print('Validated', len(d['items']), 'news items')
          PY
      - name: Commit permanent media repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/app.js assets/logo-guaranteed.jpg assets/news-placeholder.svg news.json assets/news
          if git diff --cached --quiet; then
            echo "No source changes needed"
          else
            git commit -m "Permanently repair logo and localize news images"
            git push origin main
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
