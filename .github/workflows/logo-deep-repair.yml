name: Deep logo and image repair
on:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  repair:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Force local verified image assets and safe fallbacks
        shell: bash
        run: |
          cat > assets/news-placeholder.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03152a"/><stop offset="1" stop-color="#0b4f86"/></linearGradient></defs>
            <rect width="1200" height="675" fill="url(#g)"/>
            <rect x="54" y="54" width="1092" height="567" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="3"/>
            <circle cx="600" cy="260" r="82" fill="#e51d2a" fill-opacity=".92"/>
            <path d="M560 300l28-72 35 39 30-25 49 58H560z" fill="#fff" fill-opacity=".92"/>
            <circle cx="615" cy="250" r="11" fill="#03152a"/>
            <text x="600" y="430" text-anchor="middle" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="48" font-weight="700">صورة الخبر</text>
            <text x="600" y="490" text-anchor="middle" fill="#b9cee1" font-family="Tahoma,Arial,sans-serif" font-size="28">التاسعة نيوز</text>
          </svg>
          PYTHON_REPAIR='''from pathlib import Path
          files = [Path("index.html"), Path("assets/app.js")]
          for p in files:
              s = p.read_text(encoding="utf-8")
              s = s.replace("https://raw.githubusercontent.com/altaasahnews2026/altaasah-news/main/assets/logo.jpg?v=20260916-16", "assets/logo.jpg?v=20260916-21")
              s = s.replace("assets/logo-final.svg?v=20260916-18", "assets/logo.jpg?v=20260916-21")
              s = s.replace("assets/logo-final.svg", "assets/logo.jpg?v=20260916-21")
              if p.name == "app.js":
                  s = s.replace("const LOGO=BASE+'assets/logo.jpg?v=20260916-20';", "const LOGO=BASE+'assets/logo.jpg?v=20260916-21';\nconst PLACEHOLDER=BASE+'assets/news-placeholder.svg?v=20260916-21';")
                  s = s.replace("if(!u)return LOGO;", "if(!u)return PLACEHOLDER;")
                  s = s.replace("this.src='${LOGO}'", "this.src='${PLACEHOLDER}'")
              p.write_text(s, encoding="utf-8")
          '''
          python - <<PY
          exec(PYTHON_REPAIR)
          PY
      - name: Validate image assets and JavaScript
        run: |
          test -s assets/logo.jpg
          test -s assets/news-placeholder.svg
          grep -q "assets/logo.jpg" index.html
          grep -q "assets/logo.jpg" assets/app.js
          grep -q "assets/news-placeholder.svg" assets/app.js
          node --check assets/app.js
      - name: Commit permanent repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No source changes needed"
          else
            git add index.html assets/app.js assets/news-placeholder.svg
            git commit -m "Add guaranteed local fallback for missing news images"
            git push origin main
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
