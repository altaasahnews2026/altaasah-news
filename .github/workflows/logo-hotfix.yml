name: Logo hotfix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken SVG logo references with direct JPG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('assets/logo-3d.svg?v=20260916-11','assets/logo.jpg?v=20260916-12')
          p.write_text(s,encoding='utf-8')
          p=Path('assets/app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const LOGO=BASE+'assets/logo-3d.svg?v=20260916-7';","const LOGO=BASE+'assets/logo.jpg?v=20260916-12';")
          p.write_text(s,encoding='utf-8')
          PY
          git add index.html assets/app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix logo loading by using direct image asset' || true
          git push
      - name: Remove one-time hotfix workflow
        run: |
          git rm .github/workflows/logo-hotfix.yml || true
          git commit -m 'Remove one-time logo hotfix workflow' || true
          git push || true
